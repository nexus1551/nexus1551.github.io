<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Главная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
            animation: fadeIn 0.8s ease forwards;
        }

        .tag {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #666;
        }

        .layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: auto 0;
            gap: 40px;
        }

        main {
            max-width: 70%;
            animation: fadeIn 1s ease 0.2s forwards;
            opacity: 0;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 4.5rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .nickname {
            font-size: 1.5rem;
            color: #aaa;
            margin-bottom: 40px;
        }

        .nickname span {
            color: #fff;
            font-weight: normal;
            border-bottom: 2px solid #fff;
            cursor: pointer;
            display: inline-block;
            transition: font-weight 0.2s ease, letter-spacing 0.2s ease, color 0.2s ease;
        }

        .nickname span:hover {
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
        }

        .bio-section {
            max-width: 600px;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #fff;
            border-left: 2px solid #fff;
            padding-left: 20px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: flex-start;
            width: 100%;
            max-width: 400px;
        }

        .college-link {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 15px 30px;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            border: 1px solid #fff;
        }

        .college-link:hover {
            background-color: #000;
            color: #fff;
            transform: translateX(5px);
        }

        .social-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .social-link {
            display: block;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            border: 1px solid #333;
            padding: 15px 20px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background-color: #fff;
            color: #000;
            border-color: #fff;
            transform: translateX(5px);
        }

        .collab-box {
            width: 100%;
            margin-top: 15px;
            border-top: 1px dashed #333;
            padding-top: 25px;
        }

        .collab-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .collab-email {
            font-size: 1.1rem;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
            display: inline-block;
        }

        .collab-email:hover {
            color: #888;
        }

        .side-nav {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: flex-end;
            border-left: 1px solid #222;
            padding-left: 30px;
            animation: fadeIn 1s ease 0.4s forwards;
            opacity: 0;
        }

        .nav-item {
            font-size: 1.2rem;
            color: #444;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            right: 0;
            background-color: #fff;
            transition: width 0.3s ease;
        }

        .nav-item.active, .nav-item:hover {
            color: #fff;
            transform: translateX(-5px);
        }

        .nav-item:hover::after {
            width: 100%;
        }

        footer {
            border-top: 1px solid #222;
            padding-top: 20px;
            font-size: 0.8rem;
            color: #444;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .layout { flex-direction: column; align-items: flex-start; }
            main { max-width: 100%; }
            .side-nav {
                flex-direction: row; align-items: center; border-left: none;
                border-top: 1px solid #222; padding-left: 0; padding-top: 20px;
                width: 100%; justify-content: space-between; margin-top: 30px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="tag">ID: 01 // PORTFOLIO</div>
        <div class="tag">INDEX_PAGE //</div>
    </header>

    <div class="layout">
        <main>
            <h1>Егор Фролов Денисович</h1>
            <div class="nickname">nickname: <span>nexus</span></div>
            
            <div class="bio-section">
                <p>Учусь в Петрошараге.<br>СисАдмин из группы 54-11.</p>
            </div>

            <div class="cta-container">
                <a href="https://petrocollege.ru" class="college-link" target="_blank">здесь обитаю</a>
                
                <div class="social-box">
                    <a href="https://tiktok.com" class="social-link" target="_blank">Tik Tok</a>
                    <a href="https://t.me" class="social-link" target="_blank">Telegram Channel</a>
                </div>

                <div class="collab-box">
                    <div class="collab-label">// по вопросам сотрудничества</div>
                    <a href="mailto:egoriknexus@gmail.com" class="collab-email">egoriknexus@gmail.com</a>
                </div>
            </div>
        </main>

        <nav class="side-nav">
            <a href="index.html" class="nav-item active">01 // ГЛАВНАЯ</a>
            <a href="games.html" class="nav-item">02 // ИГРОВОЙ АВТОМАТ</a>
            <a href="shows.html" class="nav-item">03 // СЕРИАЛЫ</a>
        </nav>
    </div>

    <footer>
        <div>© 2026 NEXUS</div>
        <div>ST. PETERSBURG</div>
    </footer>

</body>
</html>
