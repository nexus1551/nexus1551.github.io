<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Главная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Возвращаем анимации плавного появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        #dust-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
            width: 100%;
            animation: fadeIn 0.8s ease forwards;
        }

        .tag {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #666;
        }

        /* Единая флекс-структура расположения меню как на Shows */
        .layout {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            margin: 60px 0;
            gap: 50px;
        }

        main {
            flex: 1;
            max-width: 650px;
            width: 100%;
            animation: fadeIn 1s ease 0.2s forwards;
            opacity: 0;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 4.5rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
            width: 100%;
        }

        .nickname {
            font-size: 1.4rem;
            color: #aaa;
            margin-bottom: 40px;
        }

        /* Возвращаем крутой интерактивный глитч-эффект */
        .nickname span {
            color: #fff;
            border-bottom: 2px solid #fff;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .nickname span:hover {
            transform: skewX(-10deg);
            text-shadow: 2px 2px #ff0000, -2px -2px #0000ff;
            background: #fff;
            color: #000;
        }

        .bio-section {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #fff;
            border-left: 2px solid #fff;
            padding-left: 20px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .college-link {
            display: block;
            width: 100%;
            text-align: center;
            padding: 16px;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #fff;
            transition: all 0.3s ease;
        }

        .college-link:hover {
            background-color: #000;
            color: #fff;
            transform: translateX(5px);
        }

        .social-link {
            display: block;
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            border: 1px solid #333;
            padding: 15px;
            letter-spacing: 1px;
            background-color: rgba(0,0,0,0.7);
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background-color: #fff;
            color: #000;
            border-color: #fff;
            transform: translateX(5px);
        }

        .collab-box {
            margin-top: 15px;
            border-top: 1px dashed #333;
            padding-top: 20px;
            width: 100%;
        }

        .collab-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .collab-email {
            font-size: 1.1rem;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        .collab-email:hover {
            color: #aaa;
        }

        /* Выравнивание меню переведено в стандартный липкий флекс-блок (как на Shows) */
        .side-nav {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: flex-end;
            border-left: 1px solid #222;
            padding-left: 30px;
            position: sticky;
            top: 40px;
            animation: fadeIn 1s ease 0.4s forwards;
            opacity: 0;
        }

        .nav-item {
            font-size: 1.1rem;
            color: #444;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            white-space: nowrap;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            right: 0;
            background-color: #fff;
            transition: width 0.3s ease;
        }

        .nav-item.active, .nav-item:hover {
            color: #fff;
            transform: translateX(-5px);
        }

        .nav-item:hover::after {
            width: 100%;
        }

        footer {
            border-top: 1px solid #222;
            padding-top: 20px;
            font-size: 0.8rem;
            color: #444;
            display: flex;
            justify-content: space-between;
            width: 100%;
            animation: fadeIn 0.8s ease forwards;
        }

        @media (max-width: 900px) {
            .layout { flex-direction: column; gap: 40px; margin: 40px 0; }
            main { max-width: 100%; }
            .side-nav {
                align-items: flex-start;
                border-left: none;
                border-top: 1px solid #222;
                padding-left: 0;
                padding-top: 20px;
                width: 100%;
                position: static;
            }
            .nav-item::after { left: 0; right: auto; }
            .nav-item.active, .nav-item:hover { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <canvas id="dust-canvas"></canvas>

    <div class="wrapper">
        <header>
            <div class="tag">ID: 01 // PORTFOLIO</div>
            <div class="tag">INDEX_PAGE //</div>
        </header>

        <div class="layout">
            <main>
                <h1>Егор Фролов Денисович</h1>
                <div class="nickname">nickname: <span>nexus</span></div>
                
                <div class="bio-section">
                    <p>Учусь в Петрошараге.<br>СисАдмин из группы 54-11.</p>
                </div>

                <div class="cta-container">
                    <a href="https://petrocollege.ru" class="college-link" target="_blank">здесь обитаю</a>
                    <a href="https://tiktok.com" class="social-link" target="_blank">Tik Tok</a>
                    <a href="https://t.me" class="social-link" target="_blank">Telegram Channel</a>

                    <div class="collab-box">
                        <div class="collab-label">// по вопросам сотрудничества</div>
                        <a href="mailto:egoriknexus@gmail.com" class="collab-email">egoriknexus@gmail.com</a>
                    </div>
                </div>
            </main>

            <nav class="side-nav">
                <a href="index.html" class="nav-item active">01 // ГЛАВНАЯ</a>
                <a href="games.html" class="nav-item">02 // ИГРОВОЙ АВТОМАТ</a>
                <a href="shows.html" class="nav-item">03 // СЕРИАЛЫ</a>
            </nav>
        </div>

        <footer>
            <div>© 2026 NEXUS</div>
            <div>ST. PETERSBURG</div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('dust-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const numberOfParticles = 45;

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.3 + 0.1;
                this.opacity = Math.random() * 0.4 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y > canvas.height || this.x > canvas.width || this.x < 0) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }
        init();
        animate();
    </script>
</body>
</html>
